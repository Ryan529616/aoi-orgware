name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PUBLICATION_POLICY_SHA256: 0f9b56727e171f022d4cb8be11bc8ceafb83f63467cfa5d6e0729b762ecf2a40

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Resolve the hash-locked test-tool wheelhouse
        run: python -m pip download --require-hashes --dest .test-wheelhouse -r requirements/release-tools.lock
      - name: Install the test toolchain offline
        run: python -m pip install --no-index --find-links .test-wheelhouse --require-hashes -r requirements/release-tools.lock
      - name: Install package
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Smoke installed CLI
        run: |
          aoi --version
          aoi --help
      - name: Prepare POSIX test temp
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -d "$RUNNER_TEMP"
          {
            printf 'TMPDIR=%s\n' "$RUNNER_TEMP"
            printf 'TEMP=%s\n' "$RUNNER_TEMP"
            printf 'TMP=%s\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Prepare private Windows test temp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = [IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          if ([string]::IsNullOrEmpty($drive)) {
            throw "runner temp has no drive root"
          }
          $private = Join-Path $drive 't'
          if (Test-Path -LiteralPath $private) {
            throw "private test temp already exists"
          }
          New-Item -ItemType Directory -Path $private -ErrorAction Stop | Out-Null
          $item = Get-Item -LiteralPath $private -Force -ErrorAction Stop
          if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "private test temp is a reparse point"
          }
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User
          if ($null -eq $currentSid) {
            throw "current Windows identity has no SID"
          }
          $icacls = Join-Path $env:SystemRoot 'System32\icacls.exe'
          $arguments = @(
            $private
            '/inheritance:r'
            '/grant:r'
            "*$($currentSid.Value):(OI)(CI)F"
            '*S-1-5-18:(OI)(CI)F'
            '*S-1-5-32-544:(OI)(CI)F'
          )
          & $icacls @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "failed to harden private test temp ACL"
          }
          $env:AOI_PRIVATE_TEST_TEMP = $private
          python -c 'import os; from pathlib import Path; from aoi_orgware.company.service import _verify_windows_private_directory; _verify_windows_private_directory(Path(os.environ["AOI_PRIVATE_TEST_TEMP"]))'
          if ($LASTEXITCODE -ne 0) {
            throw "production ACL verification rejected private test temp"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMPDIR=$private"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$private"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$private"
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve the hash-locked release-tool wheelhouse
        run: |
          python -m pip download \
            --require-hashes \
            --dest .release-wheelhouse \
            -r requirements/release-tools.lock
      - name: Install the release toolchain offline
        run: |
          python -m venv .release-tools
          .release-tools/bin/python -m pip install \
            --no-index \
            --find-links .release-wheelhouse \
            --require-hashes \
            -r requirements/release-tools.lock
          python -m pip install "twine==6.2.0"
      - name: Build wheel and source distribution
        run: .release-tools/bin/python -m build --no-isolation
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify isolated artifact installs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          expected_version="$(python -c "import runpy; print(runpy.run_path('src/aoi_orgware/_version.py')['__version__'])")"
          python scripts/verify_dist.py \
            --dist-dir dist \
            --expected-version "$expected_version" \
            --build-python .release-tools/bin/python \
            --expected-build-version 1.5.0 \
            --expected-hatchling-version 1.27.0
      - name: Preflight verified distribution artifact upload
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m aoi_orgware.publication_gate preflight \
            --policy-snapshot release/publication-policy.json \
            --expected-snapshot-sha256 "$PUBLICATION_POLICY_SHA256" \
            --action artifact_upload \
            --destination "https://github.com/$GITHUB_REPOSITORY/actions/artifacts" \
            --subject dist/ \
            --json > ci-package-publication-receipt.json
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            ci-package-publication-receipt.json
          if-no-files-found: error

  package-windows-smoke:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: package-artifact
      - name: Verify the distribution artifact publication receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/src"
          Push-Location package-artifact
          try {
            python -m aoi_orgware.publication_gate verify `
              --policy-snapshot "$env:GITHUB_WORKSPACE/release/publication-policy.json" `
              --expected-snapshot-sha256 $env:PUBLICATION_POLICY_SHA256 `
              --receipt ci-package-publication-receipt.json `
              --action artifact_upload `
              --destination "https://github.com/$env:GITHUB_REPOSITORY/actions/artifacts" `
              --subject dist/ `
              --json
            if ($LASTEXITCODE -ne 0) { throw 'distribution artifact publication receipt verification failed' }
          } finally {
            Pop-Location
          }
      - name: Resolve the hash-locked release-tool wheelhouse
        shell: pwsh
        run: |
          python -m pip download `
            --require-hashes `
            --dest .release-wheelhouse `
            -r requirements/release-tools.lock
      - name: Install the release toolchain offline
        shell: pwsh
        run: |
          python -m venv .release-tools
          .\.release-tools\Scripts\python.exe -m pip install `
            --no-index `
            --find-links .release-wheelhouse `
            --require-hashes `
            -r requirements/release-tools.lock
      - name: Verify packaged entry points on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $expectedVersion = python -c "import runpy; print(runpy.run_path('src/aoi_orgware/_version.py')['__version__'])"
          python scripts/verify_dist.py `
            --dist-dir package-artifact/dist `
            --expected-version $expectedVersion `
            --build-python .\.release-tools\Scripts\python.exe `
            --expected-build-version 1.5.0 `
            --expected-hatchling-version 1.27.0

  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve the hash-locked type-check wheelhouse
        run: |
          python -m pip download \
            --require-hashes \
            --dest .typecheck-wheelhouse \
            -r requirements/typecheck-tools.lock
      - name: Install the type-check toolchain offline
        run: |
          python -m pip install \
            --no-index \
            --find-links .typecheck-wheelhouse \
            --require-hashes \
            -r requirements/typecheck-tools.lock
      - name: Type-check the published package surface (both platforms)
        # The locking/credential code has os.name-guarded branches; check the
        # native platform and an emulated win32 pass so neither side regresses.
        run: |
          python -m mypy src/aoi_orgware --ignore-missing-imports
          python -m mypy src/aoi_orgware --ignore-missing-imports --platform win32

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/coverage-tools-linux.lock
      - name: Resolve the hash-locked coverage wheelhouse
        run: |
          python -m pip download \
            --require-hashes \
            --dest .coverage-wheelhouse \
            -r requirements/coverage-tools-linux.lock
      - name: Install the coverage toolchain offline
        run: |
          python -m pip install \
            --no-index \
            --find-links .coverage-wheelhouse \
            --require-hashes \
            -r requirements/coverage-tools-linux.lock
          python -I -c 'import coverage, pytest; assert coverage.__version__ == "7.15.2"; assert pytest.__version__ == "8.4.2"'
      - name: Verify coverage path mapping
        env:
          AOI_COVERAGE_TEMP_ROOT: ${{ runner.temp }}/aoi-coverage-tests
        run: |
          mkdir -p "$AOI_COVERAGE_TEMP_ROOT"
          python scripts/verify_coverage_path_mapping.py
      - name: Install scoped subprocess coverage bootstrap
        id: coverage_bootstrap
        # The uniquely named executable .pth belongs only to this job.  It
        # covers the main interpreter and same-prefix subprocesses; the one
        # qualified system-site fixture installs its own exact child binding.
        # Most of the suite drives the CLI through real subprocesses; without
        # process_startup the measured number understates coverage by ~30
        # points (54% naive vs 83% subprocess-aware at the 0.3.0a3 baseline).
        env:
          AOI_COVERAGE_STARTUP_ROOT: ${{ runner.temp }}/aoi-coverage-startup
          AOI_COVERAGE_BOOTSTRAP_RECEIPT: ${{ runner.temp }}/aoi-coverage-bootstrap.json
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$AOI_COVERAGE_STARTUP_ROOT"
          test ! -e "$AOI_COVERAGE_BOOTSTRAP_RECEIPT"
          mkdir -m 700 "$AOI_COVERAGE_STARTUP_ROOT"
          cp scripts/coverage_fork_runtime.py "$AOI_COVERAGE_STARTUP_ROOT/aoi_coverage_fork_runtime.py"
          cp scripts/coverage_fragment_attribution.py "$AOI_COVERAGE_STARTUP_ROOT/aoi_coverage_fragment_attribution.py"
          cp scripts/coverage_sitecustomize.py "$AOI_COVERAGE_STARTUP_ROOT/aoi_coverage_bootstrap.py"
          cmp -s scripts/coverage_fork_runtime.py "$AOI_COVERAGE_STARTUP_ROOT/aoi_coverage_fork_runtime.py"
          cmp -s scripts/coverage_fragment_attribution.py "$AOI_COVERAGE_STARTUP_ROOT/aoi_coverage_fragment_attribution.py"
          cmp -s scripts/coverage_sitecustomize.py "$AOI_COVERAGE_STARTUP_ROOT/aoi_coverage_bootstrap.py"
          site_root="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          runtime_prefix="$(python -I -c 'import sys; print(sys.prefix)')"
          test -n "$site_root" && test -d "$site_root"
          test -n "$runtime_prefix" && test -d "$runtime_prefix"
          python -I -c 'import importlib.util; names=("aoi_coverage_bootstrap", "aoi_coverage_fork_runtime", "aoi_coverage_fragment_attribution"); found={name: importlib.util.find_spec(name) for name in names}; assert not any(found.values()), found'
          printf 'runtime_prefix=%s\n' "$runtime_prefix" >> "$GITHUB_OUTPUT"
          python scripts/coverage_bootstrap_install.py install \
            --site-root "$site_root" \
            --startup-root "$AOI_COVERAGE_STARTUP_ROOT" \
            --receipt "$AOI_COVERAGE_BOOTSTRAP_RECEIPT"
      - name: Verify scoped subprocess coverage bootstrap
        env:
          AOI_COVERAGE_STARTUP_ROOT: ${{ runner.temp }}/aoi-coverage-startup
        run: |
          set -euo pipefail
          python -I -c 'import importlib, pathlib, sys; root=pathlib.Path(sys.argv[1]).resolve(strict=True); names=("aoi_coverage_bootstrap", "aoi_coverage_fork_runtime", "aoi_coverage_fragment_attribution"); origins={name: pathlib.Path(importlib.import_module(name).__file__).resolve(strict=True) for name in names}; expected={name: root / (name + ".py") for name in names}; assert origins == expected, (origins, expected); assert sum(pathlib.Path(item).resolve() == root for item in sys.path if item) == 1' "$AOI_COVERAGE_STARTUP_ROOT"
      - name: Run suite under coverage
        env:
          AOI_COVERAGE_TEMP_ROOT: ${{ runner.temp }}/aoi-coverage-tests
          AOI_COVERAGE_FILE_BASE: ${{ github.workspace }}/covdata/.coverage
          AOI_COVERAGE_METADATA_ROOT: ${{ runner.temp }}/aoi-coverage-metadata
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
          TMPDIR: ${{ runner.temp }}/aoi-coverage-tests
          AOI_COVERAGE_RUNTIME_PREFIX: ${{ steps.coverage_bootstrap.outputs.runtime_prefix }}
          AOI_COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/covdata/.coverage
        run: |
          umask 077
          mkdir -p covdata "$AOI_COVERAGE_METADATA_ROOT"
          python -m pytest tests/ -q --tb=short
      - name: Remove scoped subprocess coverage bootstrap
        if: ${{ always() }}
        env:
          AOI_COVERAGE_BOOTSTRAP_RECEIPT: ${{ runner.temp }}/aoi-coverage-bootstrap.json
        run: |
          set -euo pipefail
          site_root="$(python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          test -n "$site_root" && test -d "$site_root"
          if test -e "$AOI_COVERAGE_BOOTSTRAP_RECEIPT" || test -L "$AOI_COVERAGE_BOOTSTRAP_RECEIPT"; then
            python scripts/coverage_bootstrap_install.py remove \
              --receipt "$AOI_COVERAGE_BOOTSTRAP_RECEIPT"
          fi
          test ! -e "$site_root/aoi_coverage_bootstrap.pth"
      - name: Combine coverage fragments
        id: coverage_combine
        env:
          AOI_COVERAGE_TEMP_ROOT: ${{ runner.temp }}/aoi-coverage-tests
          COVERAGE_FILE: ${{ github.workspace }}/covdata/.coverage
        run: python scripts/verify_coverage_path_mapping.py --combine-fragments covdata
      - name: Enforce coverage floor
        env:
          AOI_COVERAGE_TEMP_ROOT: ${{ runner.temp }}/aoi-coverage-tests
          COVERAGE_FILE: ${{ github.workspace }}/covdata/.coverage
        run: python -m coverage report --fail-under=80
      - name: Report coverage fragment attribution
        if: ${{ failure() && steps.coverage_combine.outcome == 'failure' }}
        env:
          AOI_COVERAGE_METADATA_ROOT: ${{ runner.temp }}/aoi-coverage-metadata
        run: |
          python -m scripts.coverage_fragment_attribution report \
            --fragments-root "${{ github.workspace }}/covdata" \
            --metadata-root "$AOI_COVERAGE_METADATA_ROOT"
