# CI coverage-only toolchain.  Keep independent of release publishing tools.
--only-binary=:all:

# coverage pins only compiled per-interpreter wheels: cp313/cp314 on
# manylinux x86_64 and win_amd64, the exact interpreters and platforms that run
# this lock.  The pure-Python `py3-none-any` wheel is deliberately absent.  It
# is resolvable everywhere, so pinning it lets any platform gap silently fall
# back to the pure-Python tracer, which emits a `no-ctracer` CoverageWarning on
# child stderr and slows tracing enough to break exact-stderr and lock-timing
# contracts.  A missing platform must fail the install, not degrade the run.
